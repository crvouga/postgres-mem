# Nightly / on-demand fuzz + DST soak (not on every PR).
name: Fuzz soak

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily
  workflow_dispatch:

concurrency:
  group: fuzz-soak
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  soak:
    name: DST / metamorphic / robustness soak
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Multi-seed soak
        run: |
          set -euo pipefail
          SEEDS=("0x5a17e0e1" "$(date -u +%Y%m%d)" "0xC0FFEE" "0xDEADBEEF")
          export POSTGRES_MEM_STATEFUL_STEPS=48
          export POSTGRES_MEM_FUZZ_RUNS=40
          for seed in "${SEEDS[@]}"; do
            echo "::group::seed=${seed}"
            POSTGRES_MEM_FUZZ_SEED="${seed}" bun run test:fuzz:soak
            echo "::endgroup::"
          done
